services:
  crowsnest-hor:
    build: .
    container_name: crowsnest-hor
    restart: unless-stopped
    # Bound to localhost only. Caddy (/etc/caddy/Caddyfile) is what reaches
    # this port and the Cloudflare tunnel talks to Caddy, never directly to
    # this container. The login is the app's own (auth.js), not Caddy's.
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
