# One-off probe of open tide data sources (the dev sandbox cannot reach them).
name: Probe tide sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/probe/tide-probe.py', '.github/workflows/probe-tide.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/probe/tide-probe.py
