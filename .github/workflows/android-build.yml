# Compile the Android app, then run it in the Android Emulator against a test server on this runner and take a
# screenshot. The twin of "iOS build check": proves the real app (Android WebView + Capacitor bridge + plugins) starts,
# authenticates with a device token and loads data. Also keeps an installable debug APK (unpaired, points at the real
# server) as a run artifact for trying the app on an Android phone without Google Play. No Google account needed.
name: Android build check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'public/net.js', 'public/outbox.js', 'public/native.js', '.github/workflows/android-build.yml', '.github/scripts/android-smoke.sh']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Start a test server and pair a device
        run: |
          npm install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/data"
          (DATA_DIR="$RUNNER_TEMP/data" PORT=8091 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 30); do curl -sf localhost:8091/healthz >/dev/null && break; sleep 1; done
          J='Content-Type: application/json'
          echo 'ci-password-12345' | DATA_DIR="$RUNNER_TEMP/data" node tools/user.js add ci master --password-stdin
          C="$RUNNER_TEMP/cookies"; curl -sf -c "$C" -X POST localhost:8091/api/auth/login -H "$J" -d '{"username":"ci","password":"ci-password-12345"}' >/dev/null
          CREW=$(curl -sf -b "$C" -X POST localhost:8091/api/crew -H "$J" -d '{"name":"Emulator crew"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf -b "$C" -X POST "localhost:8091/api/crew/$CREW/quicklog" -H "$J" -d '{"type":"work","declaration":{"rested":"yes","ackRecords":true,"ackEmergency":true,"under18":false,"declaredBy":"seafarer"}}' >/dev/null
          CODE=$(curl -sf -b "$C" -X POST localhost:8091/api/devices/pair-code -H "$J" -d '{"role":"master"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')
          TOKEN=$(curl -sf -X POST localhost:8091/api/v1/auth/pair -H "$J" -d "{\"code\":\"$CODE\",\"name\":\"CI emulator\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build the shippable debug APK (unpaired)
        working-directory: app
        run: |
          npm run sync:android
          cd android && ./gradlew assembleDebug --no-daemon -q 2>&1 | tail -25
          mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/crowsnest-debug.apk"
      - name: Rebuild for the emulator test (+ CI-only pairing seed, local test server)
        working-directory: app
        run: |
          # test build only: pre-pair the app with the test server, reached from the emulator through adb reverse
          printf "try{localStorage.setItem('cn_server','http://127.0.0.1:8091');localStorage.setItem('cn_token','%s');localStorage.setItem('cn_device','{\"name\":\"CI emulator\",\"role\":\"master\"}')}catch(e){}\n" "$TOKEN" > www/ci-seed.js
          sed -i 's#<script src="/net.js#<script src="/ci-seed.js"></script><script src="/net.js#' www/index.html
          grep -c ci-seed www/index.html
          # the app page (https://localhost) calls the plain-http test server: allowed for this build only
          node -e "const f='capacitor.config.json',c=require('./'+f);c.android.allowMixedContent=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap copy android
          cd android && ./gradlew assembleDebug --no-daemon -q 2>&1 | tail -25
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in the emulator, screenshot, check it reached the server
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: crowsnest-android-debug-apk
          path: ${{ runner.temp }}/apk/crowsnest-debug.apk
          retention-days: 14
