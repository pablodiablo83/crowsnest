# Live tide checks: the engine against NOAA's official predictions, and a real analysis of a year of Millport data.
name: Tides (live)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths: ['engine/tide.js', 'tests/tide-live.js', '.github/workflows/tides-live.yml']
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test engine/tide.test.js
      - run: node tests/tide-live.js
