# Compile the iOS app, then run it in the iOS Simulator against a test server on this Mac and take a screenshot.
# Proves the real app (WKWebView + Capacitor bridge + plugins) starts, authenticates with a device token and loads data.
# Unsigned: needs no Apple account. Runs on a GitHub-hosted Mac (private repos: Mac minutes count 10x against the
# free allowance), so only when app/ changes or by hand (Actions > iOS build check > Run workflow).
name: iOS build check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'public/net.js', 'public/outbox.js', 'public/native.js', '.github/workflows/ios-build.yml']
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Start a test server and pair a device
        run: |
          npm install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/data"
          (DATA_DIR="$RUNNER_TEMP/data" PORT=8091 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 30); do curl -sf localhost:8091/healthz >/dev/null && break; sleep 1; done
          J='Content-Type: application/json'
          CREW=$(curl -sf -X POST localhost:8091/api/crew -H "$J" -d '{"name":"Simulator crew"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf -X POST "localhost:8091/api/crew/$CREW/quicklog" -H "$J" -d '{"type":"work","declaration":{"rested":"yes","ackRecords":true,"ackEmergency":true,"under18":false,"declaredBy":"seafarer"}}' >/dev/null
          CODE=$(curl -sf -X POST localhost:8091/api/devices/pair-code -H "$J" -d '{"role":"master"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')
          TOKEN=$(curl -sf -X POST localhost:8091/api/v1/auth/pair -H "$J" -d "{\"code\":\"$CODE\",\"name\":\"CI simulator\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Copy the web pages into the app (+ CI-only pairing seed) and sync plugins
        working-directory: app
        run: |
          npm run build
          # test build only: pre-pair the app with the local test server (this file is never in a shipped build)
          printf "try{localStorage.setItem('cn_server','http://127.0.0.1:8091');localStorage.setItem('cn_token','%s');localStorage.setItem('cn_device','{\"name\":\"CI simulator\",\"role\":\"master\"}')}catch(e){}\n" "$TOKEN" > www/ci-seed.js
          sed -i '' 's#<script src="/net.js#<script src="/ci-seed.js"></script><script src="/net.js#' www/index.html
          grep -c ci-seed www/index.html
          npx cap sync ios
      - name: Compile for the iOS simulator (unsigned)
        working-directory: app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -25
      - name: Run in the simulator, screenshot, check it reached the server
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['devices']
          print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b >/dev/null
          xcrun simctl install "$DEV" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEV" uk.co.crowsnest.app
          mkdir -p "$RUNNER_TEMP/shots"
          ok=0
          for i in $(seq 30); do
            sleep 3
            if curl -sf localhost:8091/api/devices | grep -q '"lastSeen":"'; then ok=1; break; fi
          done
          sleep 8
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/sim-dashboard.png"
          if [ $ok = 1 ]; then echo "The app authenticated with its device token and loaded data."; else echo "The app never reached the server"; tail -20 "$RUNNER_TEMP/server.log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
