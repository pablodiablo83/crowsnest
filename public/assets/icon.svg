<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Crow's Nest app icon, option A "Lookout" (chosen 7 Oct 2026): white binoculars on navy, sea in the left lens,
       data bars in the right. Full bleed: iOS applies the rounded mask. Source of every icon (npm run icons). -->
  <defs>
    <linearGradient id="cnBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3F8F"/><stop offset="1" stop-color="#00154C"/></linearGradient>
    <radialGradient id="cnLens" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#0B2E6E"/><stop offset="1" stop-color="#00154C"/></radialGradient>
    <clipPath id="cnL"><circle cx="315" cy="565" r="150"/></clipPath>
    <clipPath id="cnR"><circle cx="685" cy="565" r="150"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#cnBg)"/>
  <g id="cnMark" transform="translate(512 530) scale(.94) translate(-500 -521)">
    <g fill="#FFFFFF"><rect x="232" y="262" width="196" height="150" rx="44"/><rect x="572" y="262" width="196" height="150" rx="44"/><rect x="400" y="430" width="200" height="170" rx="30"/><circle cx="315" cy="565" r="215"/><circle cx="685" cy="565" r="215"/></g>
    <circle cx="315" cy="565" r="150" fill="url(#cnLens)"/><circle cx="685" cy="565" r="150" fill="url(#cnLens)"/>
    <g clip-path="url(#cnL)">
      <path fill="#28A7C4" d="M150 600 Q 200 560 250 600 T 350 600 T 450 600 T 550 600 V760 H150Z"/>
      <path fill="#0C829B" d="M150 650 Q 205 615 260 650 T 370 650 T 480 650 V760 H150Z"/>
      <path d="M150 600 Q 200 560 250 600 T 350 600 T 450 600" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    </g>
    <g clip-path="url(#cnR)" fill="#F5B041"><rect x="600" y="575" width="42" height="80" rx="8"/><rect x="664" y="530" width="42" height="125" rx="8"/><rect x="728" y="480" width="42" height="175" rx="8"/></g>
    <path d="M220 500 A 110 110 0 0 1 300 440" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".28"/>
    <path d="M590 500 A 110 110 0 0 1 670 440" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".28"/>
  </g>
</svg>
