<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00154C">
<title>Connect - Crow's Nest</title>
<link rel="icon" type="image/png" href="/assets/icon.png?v=2">
<link rel="stylesheet" href="/hor.css?v=3">
<script src="/net.js?v=1"></script>
<style>
  .c-wrap{max-width:460px;margin:0 auto;padding:28px 16px 32px}
  .c-logo{display:block;width:96px;margin:0 auto 14px}
  .c-wrap h1{text-align:center;margin:0 0 6px}
  .c-wrap .h-lead{text-align:center}
  #cCode{font-size:22px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<main class="c-wrap" id="main">
  <img class="c-logo" src="/assets/logo.png" alt="">
  <h1>Connect this phone</h1>
  <p class="h-lead">On the Crow’s Nest web app, open <b>Hours of rest &gt; Customise &gt; Phones</b> and tap <b>Pair a phone</b>. Enter the code shown there. It works once, for 10 minutes.</p>
  <form class="h-card" id="cForm" novalidate>
    <div class="h-fld"><label for="cCode">Pairing code</label><input class="h-in" id="cCode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD-EFGH" required></div>
    <div class="h-fld"><label for="cName">Name for this phone <span class="hint">Shown in the change history.</span></label><input class="h-in" id="cName" maxlength="60" autocomplete="off"></div>
    <details class="h-more"><summary>Server</summary><div class="h-fld"><label for="cServer">Server address</label><input class="h-in" id="cServer" type="url" inputmode="url" autocapitalize="off" spellcheck="false"></div></details>
    <div id="cErr" role="alert"></div>
    <div class="h-actions"><button class="h-btn primary" type="submit" id="cGo">Connect</button></div>
  </form>
</main>
<script>
(function () {
  var N = window.CNNet, f = document.getElementById('cForm');
  document.getElementById('cServer').value = N.server();
  document.getElementById('cName').value = 'iPhone';
  if (!N.isApp) document.getElementById('cErr').innerHTML = '<div class="h-err">This page is for the Crow’s Nest phone app. In a browser, just open the <a href="/">dashboard</a>.</div>';
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('cGo'), err = document.getElementById('cErr');
    var code = document.getElementById('cCode').value.replace(/[^A-Za-z0-9]/g, '');
    if (code.length !== 8) { err.innerHTML = '<div class="h-err">The code has 8 letters and numbers.</div>'; return; }
    btn.disabled = true; err.innerHTML = '';
    try {
      await N.pair(document.getElementById('cServer').value, code, document.getElementById('cName').value.trim());
      location.replace('/');
    } catch (x) {
      var m = String(x && x.message || x);
      if (/Load failed|Failed to fetch|NetworkError/i.test(m)) m = 'Cannot reach the server. Check the connection and the server address.';
      err.innerHTML = '<div class="h-err"></div>'; err.firstChild.textContent = m.charAt(0).toUpperCase() + m.slice(1);
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
