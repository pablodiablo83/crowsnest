<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlantic weather · Crow's Nest</title>
<link rel="icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen chart table. Header strip, full-bleed chart, time bar under it, zone bulletin panel at the right (below on phones). */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#132029; --muted:#5b6b76; --line:#d3dade;
  --accent:#0b6e8a; --accent-ink:#ffffff; --sea:#cfdde6; --land:#e9d9a6; --coast:#7d6b3a;
  --warn:#b25e00; --bad:#b3261e; --good:#2f7d46; --chip:#e4eaee; --row:#f4f7f8;
  --f-ui:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1419; --panel:#121b21; --ink:#dfe7ec; --muted:#8a9aa5; --line:#24323b;
  --accent:#4fb6d3; --accent-ink:#061219; --sea:#16242d; --land:#3b3528; --coast:#8f7f55;
  --warn:#f0a84a; --bad:#ff7a70; --good:#6fcf8a; --chip:#1b2830; --row:#16212a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1419; --panel:#121b21; --ink:#dfe7ec; --muted:#8a9aa5; --line:#24323b;
  --accent:#4fb6d3; --accent-ink:#061219; --sea:#16242d; --land:#3b3528; --coast:#8f7f55;
  --warn:#f0a84a; --bad:#ff7a70; --good:#6fcf8a; --chip:#1b2830; --row:#16212a; color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hd hd" "map side" "tb side"}
body.night #app{filter:grayscale(1) sepia(1) hue-rotate(-45deg) saturate(6) brightness(.45) contrast(1.1)}
header{grid-area:hd;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
.age{font-family:var(--f-num);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.age.old{color:var(--warn)} .age.stale{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{font:600 13px var(--f-ui);letter-spacing:.03em;padding:7px 11px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{font:500 13px var(--f-ui);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;min-height:36px}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#map{grid-area:map;position:relative;background:var(--sea);min-height:0}
.leaflet-container{background:var(--sea);font-family:var(--f-ui)}
.wxpane canvas{position:absolute;left:0;top:0;pointer-events:none}
.zlab{pointer-events:none;text-align:center;line-height:1.05;color:#0b1218;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px rgba(255,255,255,.8)}
.zlab b{display:block;font:700 15px var(--f-ui);letter-spacing:.06em}
.zlab span{display:block;font:600 11px var(--f-num);white-space:nowrap}
.zlab.sel b{font-size:18px}
.legend{position:absolute;z-index:500;left:calc(10px + env(safe-area-inset-left,0px));bottom:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px 4px;font:11px var(--f-num);color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.legend .bar{width:220px;max-width:46vw;height:9px;border-radius:3px}
.legend .ticks{position:relative;height:14px;width:220px;max-width:46vw}
.legend .ticks i{position:absolute;transform:translateX(-50%);font-style:normal}
.legend .ttl{font:600 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.readout{position:absolute;z-index:500;right:calc(10px + env(safe-area-inset-right,0px));top:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:13px;min-width:190px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.readout h3{margin:0 0 4px;font:600 13px var(--f-num)}
.readout dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0}
.readout dt{color:var(--muted)} .readout dd{margin:0;font-family:var(--f-num);text-align:right}
.readout .x{position:absolute;right:4px;top:2px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;min-width:32px;min-height:32px}
.zc{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-left:calc(10px + env(safe-area-inset-left,0px))!important}
.zc button{width:46px;height:46px;border:0;background:var(--panel);color:var(--ink);font:500 24px var(--f-ui);cursor:pointer;line-height:1}
.zc button+button{border-top:1px solid var(--line)} .zc button:active{background:var(--chip)}
.zc #zFit,.zc #zBoat{font-size:19px}
.zc span{font:600 10px var(--f-num);text-align:center;color:var(--muted);padding:3px 0 4px;border-top:1px solid var(--line)}
.nmbar{position:absolute;z-index:500;left:calc(10px + env(safe-area-inset-left,0px));bottom:74px;font:600 11px var(--f-num);color:#0a1118;background:rgba(255,255,255,.75);padding:2px 6px 3px;border-radius:4px;pointer-events:none}
.nmbar i{display:block;height:5px;border:2px solid #0a1118;border-top:0;margin-bottom:2px}
.msg{position:absolute;inset:0;display:grid;place-items:center;z-index:600;color:var(--muted);font-size:15px;text-align:center;padding:20px}

.timebar{grid-area:tb;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:1px solid var(--line);background:var(--panel)}
.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:16px;cursor:pointer;grid-row:span 2}
.tnow{font:600 15px var(--f-num);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tnow em{font:500 12px var(--f-ui);font-style:normal;color:var(--muted)}
.tnow em.lr{color:var(--warn)}
.trk{position:relative}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:28px}
.days{position:relative;height:14px;font:11px var(--f-num);color:var(--muted)}
.days i{position:absolute;font-style:normal;white-space:nowrap;transform:translateX(-50%)}
.days i::before{content:"";position:absolute;left:50%;top:-6px;height:5px;border-left:1px solid var(--line)}
.lrband{position:absolute;top:13px;height:3px;background:repeating-linear-gradient(90deg,var(--warn) 0 4px,transparent 4px 7px);opacity:.6;right:0;border-radius:2px;pointer-events:none}

aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;
  padding-block:14px 20px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
aside h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.04em}
.eyebrow{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bulletin{margin:10px 0 14px;padding:10px 12px;background:var(--row);border-radius:8px;border-left:3px solid var(--accent);line-height:1.45}
.bulletin p{margin:0 0 4px} .bulletin p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--panel)}
td{padding:5px 4px;border-bottom:1px solid var(--line);font-family:var(--f-num);white-space:nowrap;font-variant-numeric:tabular-nums}
tr[data-i]{cursor:pointer} tr[data-i]:hover td{background:var(--row)}
tr.cur td{background:var(--chip);font-weight:600}
tr.day td{border-top:2px solid var(--line)}
tr.lr td{color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pos{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.pos label{font:600 12px var(--f-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pos input[type=text]{flex:1;min-width:0;font:14px var(--f-num);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:40px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.note b{color:var(--ink);font-weight:600}
.back{font:600 13px var(--f-ui);border:0;background:none;color:var(--accent);cursor:pointer;padding:0;min-height:32px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 10px;line-height:1.45}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(300px,1fr) auto minmax(0,32%);grid-template-areas:"hd" "map" "tb" "side"}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .seg{margin-left:0;order:3;width:100%} .seg button{flex:1;padding:7px 4px}
  h1 small{display:none} header{gap:6px 10px;padding-block:8px} h1{font-size:17px} .tbtn{min-height:32px;padding:4px 9px} .seg button{min-height:34px}
  .zlab b{font-size:13px} .zc button{width:40px;height:40px} .nmbar{bottom:68px} .legend .bar,.legend .ticks{width:170px}
  .readout{min-width:170px;font-size:12px}
}

/* ---- Option A "Now and ahead" (24 Nov 2026): the page opens on this list; the chart is behind "Show on chart". ---- */
#ahead{position:fixed;inset:0;z-index:2000;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0E1420;color:#E9EFF2;font-family:Lato,-apple-system,system-ui,sans-serif;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#ahead[hidden]{display:none}
#ahead>*{max-width:560px;margin-left:auto;margin-right:auto}
body.night #ahead{filter:grayscale(1) sepia(1) hue-rotate(-45deg) saturate(6) brightness(.45) contrast(1.1)}
body.ahead-on{overflow:hidden}
.ah-top{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.ah-back{color:#7FD3E6;font-weight:700;font-size:16px;text-decoration:none;min-height:44px;display:flex;align-items:center}
.ah-age{margin-left:auto;font-size:12.5px;color:#8A96A8;background:#1A2230;border-radius:20px;padding:5px 10px;white-space:nowrap}.ah-age.old{color:#F5B041}
.ah-night{font:700 14px Lato,system-ui,sans-serif;color:#E9EFF2;background:#1A2230;border:1px solid #2A3547;border-radius:12px;min-height:44px;padding:0 14px}
.ah-night[aria-pressed="true"]{border-color:#F5B041;color:#F5B041}
.ah-card{background:#17202E;border:1px solid #2A3547;border-radius:20px;padding:14px 16px}
.ah-empty b{font-size:19px;font-weight:900}.ah-empty p{color:#B9C4D3;line-height:1.5;margin:8px 0 0}
.ah-lab{font-size:12px;font-weight:900;letter-spacing:.1em;color:#F5B041}
.ah-pos{font-size:15px;font-weight:700;color:#B9C4D3;margin:3px 0 10px;font-variant-numeric:tabular-nums}
.ah-big{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ah-bfbig{font-size:46px;font-weight:900;border-radius:16px;padding:6px 14px;line-height:1}
.ah-wbig{display:flex;align-items:center;gap:8px}.ah-wbig b{font-size:34px;font-weight:900;display:block;line-height:1}.ah-wbig small{font-size:16px;color:#B9C4D3}.ah-wbig span{font-size:16px;color:#D8E0EA;font-weight:700}
.ah-arr{flex:none;color:#E9EFF2}
.ah-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ah-trio div{background:#0E1420;border-radius:12px;padding:8px 10px;min-width:0}
.ah-trio span{font-size:11px;color:#8A96A8;font-weight:900;letter-spacing:.06em;text-transform:uppercase;display:block}
.ah-trio b{font-size:22px;font-weight:900;display:block}.ah-trio em{font-style:normal;font-size:11.5px;color:#9FB0C4}
.ah-trio b.warn{color:#F5B041}
.ah-worst{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin:14px 4px 6px;font-size:14.5px}.ah-worst span{color:#8A96A8;font-weight:700}.ah-worst b{font-weight:900}
.ah-spark{padding:10px 12px 6px}.ah-bars{display:flex;align-items:flex-end;gap:3px;height:64px}.ah-bars i{flex:1;border-radius:3px 3px 0 0;min-width:2px}
.ah-ax{display:flex;justify-content:space-between;font-size:11.5px;color:#8A96A8;margin-top:4px}
.ah-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 4px 2px}.ah-hd b{font-size:18px;font-weight:900}
.ah-spd{display:flex;align-items:center;gap:6px}.ah-spd span{font-weight:900;font-size:15px;min-width:56px;text-align:center}
.ah-spd button{width:44px;height:44px;border-radius:12px;border:1px solid #2A3547;background:#1A2230;color:#E9EFF2;font:900 20px Lato,system-ui,sans-serif}
.ah-sub{margin:2px 4px 6px;font-size:12.5px;color:#9FB0C4}
.ah-list{list-style:none;margin:0;padding:0}
.ah-row{display:grid;grid-template-columns:minmax(76px,.95fr) 50px minmax(0,1.2fr) 56px minmax(56px,.8fr);align-items:center;gap:6px;padding:10px 4px;border-bottom:1px solid #222C3B}
.ah-row.long{opacity:.6}
.ah-when b{display:block;font-size:16px;font-weight:900}.ah-when span{font-size:11.5px;color:#8A96A8;white-space:nowrap}
.ah-bf{font-size:19px;font-weight:900;border-radius:10px;text-align:center;padding:6px 0}
.ah-wind{display:flex;align-items:center;gap:4px;min-width:0}.ah-wind b{display:block;font-size:16px;font-weight:900;white-space:nowrap}.ah-wind span{font-size:11.5px;color:#9FB0C4}
.ah-sea b{display:block;font-size:16px;font-weight:900;white-space:nowrap}.ah-sea span{font-size:11.5px;color:#9FB0C4}
.ah-flag i{font-style:normal;font-size:11.5px;font-weight:900;display:block}.ah-flag .sq{color:#F5B041}.ah-flag .arr{color:#7FD3E6}.ah-flag .tr{color:#8A96A8}
.ah-chart{display:block;width:100%;margin:14px auto 0;min-height:50px;border-radius:14px;border:1.5px solid #2E8FA8;background:transparent;color:#7FD3E6;font:900 16px Lato,system-ui,sans-serif}
.ah-note{font-size:12px;color:#8A96A8;line-height:1.45;margin:14px 4px 0}
#ahead button:focus-visible,#ahead a:focus-visible{outline:3px solid #F5B041;outline-offset:2px}
@media (max-width:360px){.ah-row{grid-template-columns:70px 46px minmax(0,1fr) 50px}.ah-flag{grid-column:1/-1}.ah-bfbig{font-size:38px}.ah-wbig b{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="/net.js?v=1"></script>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="/" aria-label="Back to dashboard">‹ Dashboard</a>
    <button class="tbtn" id="bAhead">‹ Now and ahead</button>
    <h1>Atlantic weather <small>ARC zones, Las Palmas → Saint Lucia</small></h1>
    <span class="age" id="age">loading…</span>
    <div class="seg" role="group" aria-label="Chart layer" id="layers">
      <button data-l="wind" aria-pressed="true">Wind</button>
      <button data-l="gust" aria-pressed="false">Gusts</button>
      <button data-l="sea" aria-pressed="false">Sea</button>
      <button data-l="swell" aria-pressed="false">Swell</button>
      <button data-l="rain" aria-pressed="false">Rain</button>
    </div>
    <div class="tools">
      <button class="tbtn" id="bIso" aria-pressed="true">Isobars</button>
      <button class="tbtn" id="bRoute" aria-pressed="true">Route</button>
      <button class="tbtn" id="bNight" aria-pressed="false">Night</button>
    </div>
  </header>
  <div id="map"><div class="msg" id="msg">Loading chart and forecast…</div>
    <div class="legend" id="legend" hidden></div>
    <div class="readout" id="readout" hidden></div>
  </div>
  <div class="timebar">
    <button class="play" id="play" aria-label="Play forecast">▶</button>
    <div class="tnow" id="tnow">–</div>
    <div class="trk">
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="Forecast time">
      <div class="days" id="days"></div>
    </div>
  </div>
  <aside id="side"></aside>
</div>
<div id="ahead" role="region" aria-label="Now and ahead on your route"><div class="ah-card ah-empty"><b>Loading forecast…</b></div></div>

<!-- bump ?v= whenever a script changes: Cloudflare lets Safari keep scripts for hours (24 Nov 2026: an old atlantic.js left the list on "Loading") -->
<script src="/atlantic-ahead.js?v=2"></script>
<script src="/atlantic-map.js?v=2"></script>
<script src="/atlantic.js?v=3"></script>
</body>
</html>
